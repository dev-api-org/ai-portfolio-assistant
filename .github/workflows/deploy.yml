name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke test import
        run: |
          python -c "import importlib,sys,pathlib; r=pathlib.Path('.').resolve(); sys.path.insert(0,str(r)); importlib.import_module('frontend.streamlit_chat_canvas')"
