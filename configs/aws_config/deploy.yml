name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main  # Triggers deployment when you push to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Get the code from the repo
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Create the Zip file (Just like you did manually!)
      - name: Generate Deployment Package
        run: zip -r deploy.zip . -x '*.git*' '*.github*' 'proj_env/*' '.venv/*' '__pycache__/*'

      # 3. Send it to AWS
      - name: Deploy to EB
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: Devfolio   # <--- UPDATE THIS if different
          environment_name: Devfolio-env-1  # <--- UPDATE THIS (Copy exactly from AWS)
          version_label: "ver-${{ github.sha }}"
          region: us-east-1                           # <--- UPDATE THIS (Check your AWS region)
          deployment_package: deploy.zip
